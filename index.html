<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º DAM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .subjects {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .subject-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .subject-icon {
            font-size: 2em;
            line-height: 1;
        }

        .subject-text {
            flex: 1;
        }

        .subject-text h3 {
            font-size: 1.3em;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .subject-text p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .subject-count {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.8em;
            white-space: nowrap;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 0.85em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .subject-btn {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2º DAM</h1>
        <div class="subjects" id="subjects"></div>

        <div class="footer">Curso 2026-2027</div>
    </div>

    <script src="datos.js"></script>
    <script>
        const contenedor = document.getElementById('subjects');

        Object.entries(ASIGNATURAS).forEach(([clave, a]) => {
            const link = document.createElement('a');
            link.className = 'subject-btn';
            link.href = clave + '/' + clave + '.html';

            const icono = document.createElement('span');
            icono.className = 'subject-icon';
            icono.textContent = a.icono;

            const texto = document.createElement('div');
            texto.className = 'subject-text';

            const titulo = document.createElement('h3');
            titulo.textContent = a.sigla;
            texto.appendChild(titulo);

            if (a.nombre) {
                const desc = document.createElement('p');
                desc.textContent = a.nombre;
                texto.appendChild(desc);
            }

            const n = a.tests.length;
            const contador = document.createElement('span');
            contador.className = 'subject-count';
            contador.textContent = n === 1 ? '1 test' : n + ' tests';

            link.appendChild(icono);
            link.appendChild(texto);
            link.appendChild(contador);
            contenedor.appendChild(link);
        });
    </script>
</body>
</html>
