<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de SGE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .mode-selection {
            display: block;
        }

        .mode-description {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .mode-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s ease;
            display: block;
            width: 100%;
            text-align: left;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .mode-btn h3 {
            margin-bottom: 8px;
            font-size: 1.2em;
        }

        .mode-btn p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .feedback-message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Caja de consejo para recordar (modo feedback inmediato) */
        .tip-message {
            margin: 10px 0 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fff8e1;
            color: #6d4c00;
            border: 1px solid #ffe08a;
            border-left: 5px solid #f5b800;
            text-align: left;
            line-height: 1.45;
            display: none;
        }

        .tip-message strong {
            display: block;
            margin-bottom: 5px;
        }

        .progress-bar {
            background: #f0f0f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .answer-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .answer-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .answer-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .answer-btn.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .answer-btn.incorrect {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: none;
        }

        .score {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 30px;
        }

        .review-btn, .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            font-size: 1em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s ease;
        }

        .review-btn:hover, .restart-btn:hover {
            transform: translateY(-2px);
        }

        .review-container {
            display: none;
            text-align: left;
        }

        .review-question {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .review-question.wrong {
            border-left-color: #dc3545;
        }

        .review-question h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .review-answer {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .review-answer.user-answer {
            background: #dc3545;
            color: white;
        }

        .review-answer.correct-answer {
            background: #28a745;
            color: white;
        }

        .review-answer.neutral {
            background: #e9ecef;
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .question {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test de SGE</h1>

        <div id="mode-selection" class="mode-selection">
            <div class="mode-description">
                Elige cómo quieres realizar el test:
            </div>

            <button class="mode-btn" onclick="startQuiz('immediate')">
                <h3>🔍 Feedback Inmediato</h3>
                <p>Te mostraré si cada respuesta es correcta o incorrecta al momento, con un consejo para recordarla</p>
            </button>

            <button class="mode-btn" onclick="startQuiz('final')">
                <h3>📊 Resultados al Final</h3>
                <p>Verás todas las respuestas correctas e incorrectas al terminar</p>
            </button>
        </div>

        <div id="quiz-container" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="question-container">
                <div class="question-number" id="question-number"></div>
                <div class="question" id="question-text"></div>
                <div class="answers" id="answers-container"></div>
                <div id="feedback-message" class="feedback-message"></div>
                <div id="tip-message" class="tip-message"></div>
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>
                Siguiente
            </button>
        </div>

        <div class="results" id="results-container">
            <div class="score" id="final-score"></div>
            <div class="score-text" id="score-text"></div>
            <button class="review-btn" onclick="showReview()">Ver Revisión</button>
            <button class="restart-btn" onclick="restartQuiz()">Reiniciar Test</button>
        </div>

        <div class="review-container" id="review-container">
            <h2 style="margin-bottom: 20px; color: #333;">Revisión de Respuestas</h2>
            <div id="review-content"></div>
            <button class="restart-btn" onclick="restartQuiz()" style="margin-top: 20px;">
                Reiniciar Test
            </button>
        </div>
    </div>

    <script>
       const examen = [

  // ===== 1. UD01 · SISTEMAS ERP-CRM-BI =====
  {
    pregunta: "¿Cuál es la traducción literal de ERP («Enterprise Resource Planning»)?",
    respuestas: [
      "Gestión de relaciones con los clientes",
      "Planificación de recursos empresariales",
      "Inteligencia de negocio empresarial",
      "Registro electrónico de proveedores"
    ],
    correcta: 1,
    consejo: "La R de ERP es «Resource» (recursos). La C de CRM es «Customer» (cliente). Si hay una C, va de clientes; si hay una R, va de recursos."
  },
  {
    pregunta: "¿Qué procesos automatiza principalmente un sistema CRM según la UD01?",
    respuestas: [
      "Nóminas, amortizaciones y contabilidad",
      "Producción, almacenaje y distribución",
      "Predicciones y cuadros de mando",
      "Datos de clientes, ventas y campañas"
    ],
    correcta: 3,
    consejo: "CRM = Customer Relationship Management. Todo lo que rodea al cliente: sus datos, el seguimiento de sus ventas y las campañas dirigidas a él."
  },
  {
    pregunta: "Según la UD01, ¿qué periodo temporal permite analizar un sistema BI?",
    respuestas: [
      "Pasado, presente y futuro con predicciones",
      "Solo el pasado, a partir de informes cerrados",
      "Solo el presente, con datos en tiempo real",
      "Solo el futuro, mediante simulaciones"
    ],
    correcta: 0,
    consejo: "El BI mira en las tres direcciones: qué pasó (pasado), cómo estamos (presente) y qué pasará (predicciones) para ayudar a decidir."
  },
  {
    pregunta: "¿Por qué el tema usa «Sistemas ERP» como abreviatura de «Sistemas ERP-CRM-BI»?",
    respuestas: [
      "Porque CRM y BI quedaron obsoletos hace años",
      "Porque la normativa obliga a llamarlos solo ERP",
      "Porque la mayoría de ERP ya integran CRM y BI",
      "Porque CRM y BI solo se ofrecen en la nube"
    ],
    correcta: 2,
    consejo: "CRM y BI son «complementos naturales» del ERP y hoy vienen integrados, así que al decir ERP ya se sobreentienden los tres."
  },
  {
    pregunta: "¿Cuál de las siguientes NO es una ventaja de implantar un ERP frente a programas individuales?",
    respuestas: [
      "Seguridad aplicada de forma centralizada",
      "Nuevas funciones mediante conectores",
      "Una única instalación y mantenimiento",
      "Menor coste inicial que apps sencillas"
    ],
    correcta: 3,
    consejo: "El coste inicial es una DESVENTAJA: instalar y configurar un ERP puede salir más caro que unas pocas apps sencillas."
  },
  {
    pregunta: "La desventaja «punto único de fallo» de un ERP se refiere a que…",
    respuestas: [
      "un corte de luz apaga solo el módulo de ventas",
      "un ataque exitoso puede exponer toda la información",
      "cada módulo requiere su propia contraseña maestra",
      "los datos se duplican en cada aplicación instalada"
    ],
    correcta: 1,
    consejo: "Todo en un mismo sistema = todos los huevos en la misma cesta. Si atacan con éxito ese sistema, queda expuesta TODA la información."
  },
  {
    pregunta: "¿Qué describe la desventaja de «sobrecarga de recursos» de un ERP?",
    respuestas: [
      "Funciones de sobra que confunden al usuario",
      "Un consumo eléctrico excesivo del servidor",
      "Una base de datos que crece sin control",
      "Conectores que ralentizan el procesador"
    ],
    correcta: 0,
    consejo: "No es un problema técnico, es de usabilidad: hay más opciones de las que el usuario necesita y eso le lía."
  },
  {
    pregunta: "Para la mayoría de organizaciones, ¿qué opción recomienda la UD01?",
    respuestas: [
      "Programar el ERP a medida, por ser más robusto",
      "Combinar varias aplicaciones de gestión sueltas",
      "Personalizar un ERP existente y consolidado",
      "Usar una carpeta compartida con base de datos"
    ],
    correcta: 2,
    consejo: "Programar un ERP robusto desde cero es muy costoso. Lo recomendable es partir de uno existente «de cierta entidad» y personalizarlo."
  },
  {
    pregunta: "En un ERP existente, ¿cómo se realiza la personalización funcional y la visual?",
    respuestas: [
      "Funcional con temas y visual con módulos",
      "Funcional con SQL y visual con conectores",
      "Funcional con licencias y visual con CSS",
      "Funcional con módulos y visual con temas"
    ],
    correcta: 3,
    consejo: "Módulos/plugins añaden FUNCIONES; los temas cambian el ASPECTO. Igual que en WordPress: plugins para hacer, temas para ver."
  },
  {
    pregunta: "¿Qué riesgo concreto menciona la UD01 al elegir un ERP con licencia cerrada?",
    respuestas: [
      "Obligación de publicar el código modificado",
      "Cambios de tarifa, cierre o trabas al migrar",
      "Uso limitado a un único equipo de la empresa",
      "Borrado automático de datos al caducar"
    ],
    correcta: 1,
    consejo: "Licencia cerrada = dependencia del desarrollador. Si sube precios, cierra o te pone pegas para irte, estás atado."
  },
  {
    pregunta: "¿Qué grupo contiene ÚNICAMENTE ERP de licencia privativa según la UD01?",
    respuestas: [
      "SAP, Odoo y JD Edwards",
      "AbanQ, OpenBravo y Navision",
      "SAP, Navision y JD Edwards",
      "Odoo, AbanQ y OpenBravo"
    ],
    correcta: 2,
    consejo: "Privativos: SAP, Navision (Microsoft) y JD Edwards (Oracle) → grandes multinacionales. Libres: Odoo, AbanQ y OpenBravo."
  },
  {
    pregunta: "Al implantar un ERP, ¿cuál de estos es un problema «relacionado con los datos»?",
    respuestas: [
      "Directivos que no ven las ventajas del cambio",
      "Empleados con miedo a perder su puesto",
      "Una infraestructura de red insuficiente",
      "Codificaciones de caracteres heterogéneas"
    ],
    correcta: 3,
    consejo: "Problemas de datos = problemas al MIGRAR: datos incompletos, mal organizados, cifrados o con codificaciones distintas. La red es un problema técnico."
  },
  {
    pregunta: "¿Qué solución propone el tema ante la resistencia de los empleados al nuevo ERP?",
    respuestas: [
      "Formación completa en horario laboral y feedback",
      "Formación voluntaria fuera de la jornada laboral",
      "Mantener el sistema antiguo en paralelo siempre",
      "Sustituir a quienes no se adapten al sistema"
    ],
    correcta: 0,
    consejo: "Formación DENTRO del horario (no como un extra), canales de comunicación y celebrar los éxitos de los empleados."
  },
  {
    pregunta: "Un trabajador autónomo que emprende su propio negocio es, según el glosario…",
    respuestas: [
      "una persona jurídica, por ser emprendedor",
      "una persona física, aunque sea emprendedor",
      "una sociedad unipersonal sin patrimonio",
      "una entidad sin derechos ni obligaciones"
    ],
    correcta: 1,
    consejo: "Autónomo = persona física, y responde de sus deudas con su patrimonio personal. Las jurídicas son sociedades, fundaciones, corporaciones…"
  },
  {
    pregunta: "¿Con qué responde de sus deudas una persona jurídica?",
    respuestas: [
      "Con el patrimonio personal de sus socios",
      "Con el patrimonio de sus empleados",
      "Con los bienes de la propia entidad",
      "Con un aval obligatorio del Estado"
    ],
    correcta: 2,
    consejo: "Física → patrimonio propio. Jurídica → bienes de la ENTIDAD. Por eso se constituyen sociedades: para separar patrimonio."
  },
  {
    pregunta: "¿Qué caracteriza a una factura proforma?",
    respuestas: [
      "Es una oferta previa sin valor contable",
      "Sustituye a la factura y tiene valor contable",
      "Es un ticket sin datos del destinatario",
      "Rectifica una factura emitida con errores"
    ],
    correcta: 0,
    consejo: "«Pro forma» = «para la forma». Es un presupuesto con aspecto de factura, debe llevar «proforma» bien visible y NO cuenta en contabilidad."
  },
  {
    pregunta: "Un ticket de supermercado sin los datos del comprador ni el IVA desglosado es…",
    respuestas: [
      "una factura proforma",
      "una factura completa",
      "un albarán de entrega",
      "una factura simplificada"
    ],
    correcta: 3,
    consejo: "Factura simplificada = ticket. Le faltan datos para ser completa (la completa lleva emisor, receptor e IVA desglosado)."
  },
  {
    pregunta: "En una factura comercial, ¿qué es el «momento del devengo»?",
    respuestas: [
      "Cuando el cliente paga la factura",
      "Cuando nace la obligación tributaria",
      "Cuando se entrega la mercancía",
      "Cuando se presenta la declaración"
    ],
    correcta: 1,
    consejo: "Devengo ≠ pago. Es el instante en que «nace» la obligación de pagar el impuesto, aunque se cobre o se declare más tarde."
  },
  {
    pregunta: "¿Qué diferencia hay entre línea de producción y orden de producción?",
    respuestas: [
      "La línea fija cantidad y fecha; la orden, las operaciones",
      "Ambas son sinónimos y se emplean de forma indistinta",
      "La orden fija cantidad, fecha y línea; la línea, operaciones",
      "La línea es el almacén; la orden, la ruta de transporte"
    ],
    correcta: 2,
    consejo: "La LÍNEA es la receta (qué operaciones y recursos). La ORDEN es cocinarla un día concreto: cuánto, cuándo y con qué línea."
  },
  {
    pregunta: "Según el glosario, ¿desde dónde parte el proceso de distribución?",
    respuestas: [
      "Desde el proveedor de materias primas",
      "Desde la propia línea de producción",
      "Desde el punto de venta al público",
      "Desde el lugar de almacenamiento"
    ],
    correcta: 3,
    consejo: "Distribución: almacén → consumidor final. La logística es más amplia: coordina, gestiona y transporta hasta el cliente final."
  },
  {
    pregunta: "¿Qué define a los impuestos y tributos según el glosario empresarial?",
    respuestas: [
      "Un pago al Estado sin contraprestación directa",
      "Un pago al Estado a cambio de un servicio concreto",
      "Un pago a proveedores por los bienes recibidos",
      "Una cuota periódica por un servicio en la nube"
    ],
    correcta: 0,
    consejo: "La clave es «SIN contraprestación directa»: pagas, pero no recibes a cambio un bien o servicio concreto en ese momento."
  },

  // ===== 2. UD02 · CONTEXTO, ON-PREMISE Y NUBE =====
  {
    pregunta: "¿Qué era un «Mainframe» en los inicios de la informática empresarial?",
    respuestas: [
      "Una red de PCs domésticos interconectados",
      "Un servidor alojado en la nube con pago por uso",
      "Un ordenador grande y caro con varias terminales",
      "Un contenedor que agrupa varias bases de datos"
    ],
    correcta: 2,
    consejo: "Mainframe = un único «ordenador central» grande y caro, con muchas terminales conectadas. Solo al alcance de grandes empresas."
  },
  {
    pregunta: "¿Qué diferencia hay entre escalado vertical y horizontal?",
    respuestas: [
      "Vertical: comprar más equipos; horizontal: mejorar el servidor",
      "Vertical: mejorar el servidor; horizontal: comprar más equipos",
      "Ambos consisten en contratar más potencia en la nube",
      "Vertical: añadir más RAM; horizontal: añadir más discos"
    ],
    correcta: 1,
    consejo: "Vertical = crecer hacia ARRIBA (un servidor más potente). Horizontal = crecer hacia los LADOS (más servidores en fila)."
  },
  {
    pregunta: "¿Qué ventaja ofrece tener el ERP en un servidor de la propia empresa?",
    respuestas: [
      "Elimina por completo los costes de mantenimiento",
      "Permite escalar en momentos puntuales de carga",
      "No requiere ninguna inversión inicial en hardware",
      "Los datos no salen, evitando el espionaje industrial"
    ],
    correcta: 3,
    consejo: "On-premise: los datos se quedan en casa (más control). A cambio pagas hardware, luz, mantenimiento y no escalas fácilmente."
  },
  {
    pregunta: "¿Cuál de estos es un inconveniente de los servicios en la nube según la UD02?",
    respuestas: [
      "Depender de internet y del buen hacer del proveedor",
      "Asumir una fuerte inversión inicial en hardware",
      "Pagar el consumo eléctrico del propio servidor físico",
      "No poder acceder al sistema desde un smartphone"
    ],
    correcta: 0,
    consejo: "La nube son «servidores de otra empresa»: si cae tu conexión o falla el proveedor, te quedas sin sistema."
  },
  {
    pregunta: "¿Qué normativa de protección de datos se cita para Europa y para España?",
    respuestas: [
      "LOPDGDD en Europa y RGPD en España",
      "LSSI en Europa y RGPD en España",
      "RGPD en Europa y LOPDGDD en España",
      "GDPR en EE. UU. y LOPD en Europa"
    ],
    correcta: 2,
    consejo: "RGPD es el Reglamento General europeo (más «General» = más amplio). La LOPDGDD es la ley orgánica española que lo adapta."
  },
  {
    pregunta: "¿Qué ediciones de Odoo existen y cuál se utiliza en el curso?",
    respuestas: [
      "Community de pago y Enterprise libre; se usa Enterprise",
      "Community libre y Enterprise de pago; se usa Community",
      "Ambas libres con distinto soporte; se usa Enterprise",
      "Ambas de pago por usuario; se usa Community"
    ],
    correcta: 1,
    consejo: "Community = comunidad = libre y gratis. Enterprise = empresa = de pago. En clase usamos Community."
  },
  {
    pregunta: "¿Qué problemas presenta la instalación tipo «carpeta compartida»?",
    respuestas: [
      "Coste excesivo de licencias por cada usuario",
      "Dependencia total de un proveedor de nube",
      "Consumo excesivo de RAM en el servidor",
      "Acceso simultáneo, seguridad e integridad"
    ],
    correcta: 3,
    consejo: "Varios PCs abriendo el mismo fichero Access a la vez = conflictos de acceso simultáneo, datos corruptos y nula seguridad."
  },
  {
    pregunta: "¿Qué relación entre ejemplo y tipo de servicio en la nube es CORRECTA?",
    respuestas: [
      "VPS: SaaS · hosting PHP/MySQL: IaaS · Gmail: PaaS",
      "VPS: PaaS · hosting PHP/MySQL: SaaS · Gmail: IaaS",
      "VPS: IaaS · hosting PHP/MySQL: SaaS · Gmail: PaaS",
      "VPS: IaaS · hosting PHP/MySQL: PaaS · Gmail: SaaS"
    ],
    correcta: 3,

        let currentQuestion = 0;
        let userAnswers = [];
        let selectedAnswer = null;
        let shuffledExamen = [];
        let gameMode = 'final';

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuiz(mode) {
            gameMode = mode;
            shuffledExamen = shuffleArray(examen);
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            initQuiz();
        }

        function initQuiz() {
            currentQuestion = 0;
            userAnswers = [];
            selectedAnswer = null;
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('review-container').style.display = 'none';
            showQuestion();
        }

        function showQuestion() {
            const question = shuffledExamen[currentQuestion];

            document.getElementById('question-number').textContent =
                `Pregunta ${currentQuestion + 1} de ${shuffledExamen.length}`;
            document.getElementById('question-text').textContent = question.pregunta;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';

            document.getElementById('feedback-message').style.display = 'none';
            const tipMessage = document.getElementById('tip-message');
            tipMessage.style.display = 'none';
            tipMessage.innerHTML = '';

            question.respuestas.forEach((respuesta, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = respuesta;
                button.onclick = () => selectAnswer(index);
                answersContainer.appendChild(button);
            });

            updateProgress();
            document.getElementById('next-btn').disabled = true;
            selectedAnswer = null;
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            const question = shuffledExamen[currentQuestion];

            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, i) => {
                btn.classList.remove('selected', 'correct', 'incorrect');
                if (i === index) {
                    btn.classList.add('selected');
                }
            });

            if (gameMode === 'immediate') {
                const feedbackMessage = document.getElementById('feedback-message');
                const isCorrect = selectedAnswer === question.correcta;

                buttons.forEach((btn, i) => {
                    if (i === question.correcta) {
                        btn.classList.add('correct');
                    } else if (i === selectedAnswer && !isCorrect) {
                        btn.classList.add('incorrect');
                    }
                    btn.onclick = null;
                });

                if (isCorrect) {
                    feedbackMessage.textContent = '¡Correcto! 🎉';
                    feedbackMessage.className = 'feedback-message feedback-correct';
                } else {
                    feedbackMessage.textContent = `Incorrecto. La respuesta correcta es: ${question.respuestas[question.correcta]}`;
                    feedbackMessage.className = 'feedback-message feedback-incorrect';
                }
                feedbackMessage.style.display = 'block';

                // Consejo para recordar
                if (question.consejo) {
                    const tipMessage = document.getElementById('tip-message');
                    tipMessage.innerHTML = '';
                    const title = document.createElement('strong');
                    title.textContent = '💡 Consejo para recordarlo';
                    const text = document.createElement('span');
                    text.textContent = question.consejo;
                    tipMessage.appendChild(title);
                    tipMessage.appendChild(text);
                    tipMessage.style.display = 'block';
                }
            }

            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            if (selectedAnswer === null) return;

            userAnswers.push(selectedAnswer);

            if (currentQuestion < shuffledExamen.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledExamen.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function showResults() {
            const correctAnswers = userAnswers.filter((answer, index) =>
                answer === shuffledExamen[index].correcta
            ).length;

            const percentage = Math.round((correctAnswers / shuffledExamen.length) * 100);

            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('results-container').style.display = 'block';

            document.getElementById('final-score').textContent = `${correctAnswers}/${shuffledExamen.length}`;
            document.getElementById('score-text').textContent =
                `Has acertado ${correctAnswers} de ${shuffledExamen.length} preguntas (${percentage}%)`;
        }

        function showReview() {
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('review-container').style.display = 'block';

            const reviewContent = document.getElementById('review-content');
            reviewContent.innerHTML = '';

            shuffledExamen.forEach((question, index) => {
                const isCorrect = userAnswers[index] === question.correcta;

                const reviewDiv = document.createElement('div');
                reviewDiv.className = `review-question ${!isCorrect ? 'wrong' : ''}`;

                let html = `<h3>Pregunta ${index + 1}: ${question.pregunta}</h3>`;

                question.respuestas.forEach((respuesta, respuestaIndex) => {
                    let className = 'neutral';

                    if (respuestaIndex === question.correcta) {
                        className = 'correct-answer';
                    } else if (respuestaIndex === userAnswers[index] && !isCorrect) {
                        className = 'user-answer';
                    }

                    html += `<div class="review-answer ${className}">
                        ${respuesta}
                        ${respuestaIndex === question.correcta ? ' ✓ (Correcta)' : ''}
                        ${respuestaIndex === userAnswers[index] && !isCorrect ? ' ✗ (Tu respuesta)' : ''}
                    </div>`;
                });

                reviewDiv.innerHTML = html;
                reviewContent.appendChild(reviewDiv);
            });
        }

        function restartQuiz() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('review-container').style.display = 'none';
            document.getElementById('mode-selection').style.display = 'block';
        }

        window.onload = function() {
            document.getElementById('mode-selection').style.display = 'block';
        };
    </script>
